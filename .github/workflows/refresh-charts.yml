name: Refresh K-POP and J-POP charts

on:
  push:
    paths:
      - "scripts/update_chart_data.py"
      - ".github/workflows/refresh-charts.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-music-charts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install request client
        run: python -m pip install requests

      - name: Fetch charts and compare with previous snapshot
        run: python scripts/update_chart_data.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Commit changed chart data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/chart-data.json
          if git diff --cached --quiet; then
            echo "Chart data has not changed."
            exit 0
          fi
          git commit -m "Update K-POP and J-POP chart data"
          git push
